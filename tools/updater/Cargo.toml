[package]
name = "flutter_hotpatch_updater"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17"
sha2 = "0.10"
hex = "0.4"
ureq = "2"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
ureq = "2"
